<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — AI Project Idea Recommender</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-wrapper">
  <div class="glass-card">

    <div class="brand">
      <h1>Create your account</h1>
      <p>Start exploring project ideas tailored to you</p>
    </div>

    <div id="banner" class="banner error"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" placeholder="Jane Doe" autocomplete="name">
        <div class="field-error" id="full_name-error"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="field-error" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" placeholder="Repeat your password" autocomplete="new-password">
        <div class="field-error" id="confirm_password-error"></div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Register</button>
    </form>

    <div class="form-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

  </div>
</div>

<script src="js/main.js"></script>
<script src="./js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
